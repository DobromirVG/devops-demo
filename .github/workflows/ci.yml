name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

  create_release:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            Automated release generated by GitHub Actions.
  deploy:
    needs: create_release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Mock FTP Deploy
        run: |
          echo "Connecting to FTP server..."
          echo "Uploading files..."
          echo "Pretend deployment successful!"
  
          echo "This is a mock deploy for university coursework."

  blue_green:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Start Blue-Green Deployment Simulation
        run: |
          echo "Current active version: BLUE"
          echo "Deploying new version to GREEN..."
          echo "Running health checks..."
          echo "Health checks passed!"
          echo "Switching traffic from BLUE → GREEN"
          echo "GREEN is now active."
          echo "Blue-Green deployment complete."

  rollback_simulation:
    needs: blue_green
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Perform health check
        run: |
          echo "Performing health check on GREEN deployment..."
          # Simulate a successful health check (you can switch 0 to 1 to simulate failure)
          exit 0

      - name: Rollback if health check fails
        if: failure()
        run: |
          echo "Health check failed!"
          echo "Rolling back to BLUE version..."
          echo "Rollback complete."

      - name: Confirm deployment
        if: success()
        run: |
          echo "Health check passed!"
          echo "GREEN deployment is stable."
          echo "No rollback required."
         